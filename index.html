<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>WebGL2 WBOIT Lab</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header><h1>WebGL2 Weighted OIT</h1><div id="status">boot</div></header>

      <pre id="stats">{}</pre>

  </main>
  <script type="module" src="./src/main.js"></script>

</html>
